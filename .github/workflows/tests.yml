name: Run Tests

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev python3-pyaudio

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --tb=short

    - name: Run unit tests with coverage
      if: matrix.python-version == '3.11'
      run: |
        pip install pytest-cov
        pytest tests/unit/ --cov=. --cov-report=xml --cov-report=term

    - name: Upload coverage to artifacts
      if: matrix.python-version == '3.11'
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: coverage.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Only run integration tests if unit tests pass
    needs: unit-tests

    # Integration tests require the server to be running
    # Skip them in CI if server is not accessible
    # You can configure this to run in environments where the server is available

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev python3-pyaudio

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check if server is reachable
      id: server-check
      run: |
        if curl -f http://pi-server:8080/health --max-time 5; then
          echo "server_available=true" >> $GITHUB_OUTPUT
        else
          echo "server_available=false" >> $GITHUB_OUTPUT
        fi
      continue-on-error: true

    - name: Run integration tests
      if: steps.server-check.outputs.server_available == 'true'
      run: |
        pytest tests/integration/ -v -m integration --tb=short

    - name: Skip integration tests (server not available)
      if: steps.server-check.outputs.server_available != 'true'
      run: |
        echo "⚠️ Skipping integration tests - server not reachable"
        echo "Integration tests require http://pi-server:8080 to be accessible"

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint black isort

    - name: Check code formatting with black
      run: |
        black --check --diff . || echo "⚠️ Code formatting issues found (run 'black .' to fix)"
      continue-on-error: true

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff . || echo "⚠️ Import sorting issues found (run 'isort .' to fix)"
      continue-on-error: true

    - name: Run flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, lint]
    if: always()

    steps:
    - name: Check test results
      run: |
        echo "### Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Unit Tests: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Code Quality: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "${{ needs.unit-tests.result }}" != "success" ]; then
          echo "❌ Unit tests failed - check logs above" >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
        fi
