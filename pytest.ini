[pytest]
# Pytest configuration for stream-client tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths
testpaths = tests

# Markers for categorizing tests
markers =
    unit: Unit tests with mocked dependencies
    integration: Integration tests against real server
    slow: Tests that take a long time to run
    audio: Tests that require audio hardware/pygame

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options (when running with --cov)
# Run with: pytest --cov=. --cov-report=html
[coverage:run]
source = .
omit =
    tests/*
    venv/*
    .venv/*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
